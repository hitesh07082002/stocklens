name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: stocklens_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stocklens_test
      SECRET_KEY: test-secret-key-at-least-32-bytes
      DJANGO_SETTINGS_MODULE: config.settings.dev
      FMP_API_KEY: test-key
      ANTHROPIC_API_KEY: test-key
      ALLOWED_HOSTS: localhost,127.0.0.1
      FRONTEND_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m venv backend/venv
      - run: backend/venv/bin/pip install -r backend/requirements.txt
      - run: npm --prefix frontend ci
      - run: backend/venv/bin/python backend/manage.py migrate
      - run: make lint
      - run: make test
      - run: make build
